
name: SOFTS CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    name: Run Python tests
    runs-on: ubuntu-latest

    env:
      API_KEY: at02-test-token
      SOFTS_TEST_API_KEY: at02-test-token
      SOFTS_TEST_API_URL: http://127.0.0.1:8000
      API_RATE_LIMIT_PER_MINUTE: "5"
      SOFTS_TEST_TIMEOUT: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            softs_pm25_deploy/requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -r softs_pm25_deploy/requirements.txt

      - name: Verify CI environment
        run: |
          python --version
          python -c "import os; print('API_KEY configured:', bool(os.getenv('API_KEY')))"
          python -c "import os; print('RATE LIMIT:', os.getenv('API_RATE_LIMIT_PER_MINUTE'))"

      - name: Show collected tests
        run: |
          python -m pytest --collect-only -q

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn api.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > uvicorn.log 2>&1 &

          echo $! > uvicorn.pid

      - name: Wait for API server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API server is ready."
              exit 0
            fi

            echo "Waiting for API server..."
            sleep 2
          done

          echo "API server failed to start."
          cat uvicorn.log
          exit 1

      - name: Run all tests
        run: |
          python -m pytest -v -rs

      - name: Show API logs on failure
        if: failure()
        run: |
          if [ -f uvicorn.log ]; then
            cat uvicorn.log
          fi

  build-and-push:
    name: Build and push Docker image
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ductoan2710/softs-dinov3-pm25:latest
